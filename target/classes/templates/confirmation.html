<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Order placed')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main>
<div class="ok">
  <h2>Thank you, <span th:text="${order.customerName}"></span>!</h2>
  <p>Your order #<span th:text="${order.id}"></span> has been placed.</p>
</div>
<div class="card" style="margin-top:16px">
  <div th:each="i : ${order.items}" th:text="${i.quantity} + ' x ' + ${i.productName}"></div>
  <div class="price">Total: <span th:text="'$' + ${#numbers.formatDecimal(order.total, 1, 2)}"></span></div>
  <div class="muted">Delivering to: <span th:text="${order.address}"></span></div>
</div>
<p><a class="btn" th:href="@{/}">Back to menu</a></p>
</main>
</body>
</html>
