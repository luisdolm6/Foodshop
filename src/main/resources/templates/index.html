<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Menu')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main>
<h2>Menu</h2>
<div class="grid">
  <div class="card" th:each="p : ${products}">
    <h3 th:text="${p.name}">Name</h3>
    <div class="muted" th:text="${p.description}"></div>
    <div class="price" th:text="'$' + ${#numbers.formatDecimal(p.price, 1, 2)}"></div>
    <form method="post" th:action="@{/cart/add/{id}(id=${p.id})}"><button>Add to cart</button></form>
  </div>
</div>
</main>
</body>
</html>
