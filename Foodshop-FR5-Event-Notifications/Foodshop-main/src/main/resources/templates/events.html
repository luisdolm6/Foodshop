<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Events')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main>
  <h2>Festival Events</h2>
  <p class="muted">Register for an event to receive confirmation and any event updates or cancellation notices.</p>
  <p class="muted" th:if="${#lists.isEmpty(events)}">No events have been posted yet.</p>
  <div class="card" style="margin-bottom:16px" th:each="event : ${events}">
    <h3 th:text="${event.title}">Event title</h3>
    <p th:text="${event.description}"></p>
    <p th:if="${event.eventDate != null}" class="muted"
       th:text="${#temporals.format(event.eventDate, 'MMM dd, yyyy h:mm a')}"></p>
    <p th:if="${event.cancelled}" class="muted">This event has been cancelled.</p>
    <form th:if="${!event.cancelled}" th:action="@{/events/{id}/register(id=${event.id})}" method="post">
      <button type="submit">Register</button>
    </form>
  </div>
</main>
</body>
</html>
