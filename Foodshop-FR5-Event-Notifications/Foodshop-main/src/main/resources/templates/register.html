<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head th:replace="~{fragments :: head('Register')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main>
  <h2>Create Campus Account</h2>
  <p class="error" th:if="${error}" th:text="${error}"></p>
  <form class="stack" method="post" th:action="@{/register}">
    <input type="text" name="fullName" placeholder="Full name" required>
    <input type="email" name="email" placeholder="Email address (e.g., student@university.edu)" required>
    <input type="tel" name="phone" placeholder="Phone number (for pickup alerts)" required>
    <input type="password" name="password" placeholder="Create password" required>
    <button type="submit">Register</button>
  </form>
  <p class="muted" style="margin-top:14px">
    Already have an account? <a th:href="@{/login}">Log in</a>
  </p>
</main>
</body>
</html>
